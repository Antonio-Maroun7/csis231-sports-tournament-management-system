spring.application.name=sportstournament

# Load local secrets from .env (KEY=value lines). It works when the app starts from api/ (IntelliJ, mvnw)
# or from the repository root. optional: = the app still starts if the file is missing.
spring.config.import=optional:file:.env[.properties],optional:file:api/.env[.properties]

# ===== PostgreSQL connection =====
# ${DB_PASSWORD:postgres} = use env variable DB_PASSWORD if set, otherwise "postgres"
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sports_tournament_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# update = create/alter tables from the @Entity classes in model/
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.two-factor.code-validity-minutes=5
app.two-factor.max-attempts=5
app.two-factor.resend-cooldown-seconds=60

# ===== JWT =====
# JWT_SECRET: at least 32 characters (HS256). Kept in api/.env, never committed.
jwt.secret=${JWT_SECRET}
# token lifetime in milliseconds (default 2 hours)
jwt.expiration=${JWT_EXPIRATION_MS:7200000}

# ===== Bootstrap admin (optional, created only if no ADMIN exists) =====
app.bootstrap.admin.name=${ADMIN_NAME:Administrator}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}