spring.application.name=sportstournament

# ===== PostgreSQL connection =====
# ${DB_PASSWORD:postgres} = use env variable DB_PASSWORD if set, otherwise "postgres"
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sports_tournament_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# update = create/alter tables from the @Entity classes in model/
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.two-factor.code-validity-minutes=5
app.two-factor.max-attempts=5
app.two-factor.resend-cooldown-seconds=60