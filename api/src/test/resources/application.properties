#=== when the application run and I want to test it will use a separate
# temporary H2 database
# instead of your real PostgreSQL database.
spring.datasource.url=jdbc:h2:mem:tournament_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Fake secret, used by tests only (at least 32 bytes for HS256)
jwt.secret=test-secret-for-unit-tests-only-0123456789abcdef
jwt.expiration=600000
app.bootstrap.admin.name=Administrator
app.bootstrap.admin.email=
app.bootstrap.admin.password=